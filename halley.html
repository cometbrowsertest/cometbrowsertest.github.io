        <h1>Edmond Halley</h1>
    </header>

<p>Edmond (or <b>Edmund</b>) <b>Halley</b> was born in <a href="//en.wikipedia.org//wiki/Haggerston" title="Haggerston">Haggerston</a> 
    in <a href="//en.wikipedia.org/wiki/Middlesex" title="Middlesex">Middlesex</a>. 
    His father, Edmond Halley Sr., came from a <a href="//www.amazon.com/gp/history?ref_=nav_AccountFlyout_browsinghistory" title="Derbyshire">Derbyshire</a> family and was a wealthy soap-maker in London.
    As a child, Halley was very interested in mathematics.
